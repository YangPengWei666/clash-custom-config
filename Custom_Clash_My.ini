;Custom_OpenClash_Rules (定制版 v2)
;基于 Aethersailor/Custom_OpenClash_Rules Full 模板定制
;v2 变更（2026-10-09）：
;  1. [修复] MyTVSuper 规则集此前 ruleCount=0 从未生效 —— 原用 clash-classic 引用 .list 纯文本，
;     格式不匹配导致解析为 0 条。改为 7 条规则内联，不再依赖外部文件
;  2. [新增] 国内 AI 服务直连（category-ai-cn），须位于 cn 兜底之前，避免国内 AI 走代理绕路
;  3. [新增] Zoom / 开发者服务 / 学术资源 / 国外域名 四类分流（对齐上游 2026-09 后的更新）
;  4. [新增] PayPal 归入国外电商、PT 站点独立规则
;  5. 保留原有定制：离火直连、虚拟币独立组、精简媒体组、meta-rules-dat .mrs 海外 IP 段
;
;定制内容（沿用）：
;  1. 自有服务直连：离火之境游戏 + 自有域名 xiaokang.cyou（含全部子域） + serv00 SSH（置顶优先）
;  2. 虚拟币交易所独立策略组（币安/OKX等，默认新加坡/台湾）
;  3. 精简媒体策略组（移除 AppleTV+/Netflix/Disney+/HBO/PrimeVideo/Bahamut，保留 Emby/Spotify）
;  4. 海外服务 IP 段用 meta-rules-dat .mrs 规则集（telegram/twitter/facebook/google），
;     自动更新，不依赖 GeoIP.dat（Country.mmdb 无 telegram 分类，GEOIP 规则会失效）
;  5. 地区策略组精简为 6 个（港/美/日/新/台/韩）

[custom]
;设置规则标志位
;以下规则，按照从上往下的顺序遍历，优先命中上位规则，规则重复无影响
;修改顺序会影响分流效果

;===== 自有服务直连（离火游戏 + 自有域名 + serv00 SSH，置顶必须最先匹配）=====
ruleset=🎯 全球直连,clash-classic:https://cdn.jsdelivr.net/gh/YangPengWei666/clash-custom-config@refs/heads/main/my_direct.yaml,28800

;本地地址和域名直连
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
;本项目收录的直连规则
ruleset=🎯 全球直连,clash-domain:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.mrs,1800
ruleset=🎯 全球直连,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800
;本项目收录的代理规则
ruleset=🚀 手动选择,clash-domain:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.mrs,28800
ruleset=🚀 手动选择,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800
;Google Play 相关域名统一走代理（含 xn--ngstr-lra8j.com，避免被 google-cn 匹配为直连导致下载验证超时）
ruleset=🇬 谷歌服务,[]GEOSITE,google-play
;谷歌在国内可用的域名直连
ruleset=🎯 全球直连,[]GEOSITE,google-cn
;国内游戏域名直连
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn
;Steam 下载 CDN 直连
ruleset=🎯 全球直连,clash-domain:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_Domain.mrs,28800
ruleset=🎯 全球直连,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_Classical_IP.yaml,28800
;各大游戏平台下载域名直连
ruleset=🎯 全球直连,[]GEOSITE,category-game-platforms-download
;BT Tracker 相关域名直连
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker
;新增：Zoom 视频会议，默认代理，可在独立策略组切直连
ruleset=📹 Zoom,[]GEOSITE,zoom
;新增：国内 AI 服务默认直连，须位于 cn 兜底规则之前
ruleset=🎯 全球直连,[]GEOSITE,category-ai-cn
;即时通讯包括了 Telegram/WhatsApp/Line 等海外主流即时通讯软件域名
;Telegram 域名补全（t.me 等不在 category-communication 内）
ruleset=💬 即时通讯,[]GEOSITE,telegram
ruleset=💬 即时通讯,[]GEOSITE,category-communication
;社交媒体包括了 Twitter(X)/Facebook/Instagram 等海外主流社交媒体
ruleset=🌐 社交媒体,[]GEOSITE,category-social-media-!cn
ruleset=🤖 ChatGPT,[]GEOSITE,openai
ruleset=🤖 AI服务,[]GEOSITE,category-ai-!cn
ruleset=🚀 GitHub,[]GEOSITE,github
;新增：开发者服务（GitLab、Docker、软件仓库、开发工具）
ruleset=💻 开发者服务,[]GEOSITE,category-dev
;新增：学术资源（Google Scholar、IEEE、ACM 等）
ruleset=📚 学术资源,[]GEOSITE,category-scholar-!cn
;测速工具包括 SpeedTest 等主流测速工具域名
ruleset=🚀 测速工具,[]GEOSITE,category-speedtest
ruleset=🎮 Steam,[]GEOSITE,steam
ruleset=📹 YouTube,[]GEOSITE,youtube
;YouTube 辅助服务（SponsorBlock跳过广告/Dislike显示踩数），与YouTube同节点
ruleset=📹 YouTube,[]DOMAIN-SUFFIX,sponsor.ajay.app
ruleset=📹 YouTube,[]DOMAIN-SUFFIX,returnyoutubedislikeapi.com
ruleset=🍎 苹果服务,[]GEOSITE,apple
ruleset=Ⓜ️ 微软服务,[]GEOSITE,microsoft
ruleset=📢 谷歌FCM,[]GEOSITE,googlefcm
ruleset=🇬 谷歌服务,[]GEOSITE,google
ruleset=🎶 TikTok,[]GEOSITE,tiktok
;Emby 包括主流 Emby 服务相关域名
ruleset=🎥 Emby,[]GEOSITE,category-emby
ruleset=🎻 Spotify,[]GEOSITE,spotify
ruleset=🎮 游戏平台,[]GEOSITE,category-games
ruleset=🌎 国外媒体,[]GEOSITE,category-entertainment
;修复：MyTVSuper 改为内联（原 clash-classic + .list 组合导致规则数为 0，从未生效）
ruleset=🌎 国外媒体,[]DOMAIN-KEYWORD,nowtv100
ruleset=🌎 国外媒体,[]DOMAIN-KEYWORD,rthklive
ruleset=🌎 国外媒体,[]DOMAIN,mytvsuperlimited.hb.omtrdc.net
ruleset=🌎 国外媒体,[]DOMAIN,mytvsuperlimited.sc.omtrdc.net
ruleset=🌎 国外媒体,[]DOMAIN-SUFFIX,mytvsuper.com
ruleset=🌎 国外媒体,[]DOMAIN-SUFFIX,tvb.com
ruleset=🛒 国外电商,[]GEOSITE,category-ecommerce
;新增：PayPal 归入国外电商组
ruleset=🛒 国外电商,[]GEOSITE,paypal
;新增：PT 站点
ruleset=⏬ PT站点,[]GEOSITE,category-pt
;===== 虚拟币交易所（币安/OKX/HTX等，香港日本受限，默认新加坡/台湾）=====
ruleset=💰 虚拟币,clash-classic:https://cdn.jsdelivr.net/gh/YangPengWei666/clash-custom-config@refs/heads/main/crypto_exchange.yaml,28800
ruleset=🚀 手动选择,[]GEOSITE,gfw
;海外服务 IP 段规则集（meta-rules-dat，每8小时自动更新，替代手动内联和 GEOIP 数据库查询）
ruleset=💬 即时通讯,clash-ipcidr:https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/telegram.mrs,28800
ruleset=🌐 社交媒体,clash-ipcidr:https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/twitter.mrs,28800
ruleset=🌐 社交媒体,clash-ipcidr:https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/facebook.mrs,28800
ruleset=🇬 谷歌服务,clash-ipcidr:https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/google.mrs,28800
;新增：GFW 及专用规则未命中的国外域名默认直连，可在策略组中切换代理
ruleset=🌍 国外域名,[]GEOSITE,geolocation-!cn
;由于 OpenClash 使用的大陆白名单收录不全，此处留有 geosite:cn 作为国内域名兜底
ruleset=🎯 全球直连,[]GEOSITE,cn
;由于 OpenClash 使用的大陆白名单收录不全，此处留有 geoip:cn 作为国内 IP 兜底
ruleset=🎯 全球直连,[]GEOIP,cn,no-resolve
;PT/BT 优化开启会使 80/443 以外端口的流量直连
ruleset=🔀 非标端口,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800
;国内冷门域名会命中漏网之鱼，如影响使用，请设置漏网之鱼直连
;漏网之鱼直连时，无法通过 DNS 泄露测试，但是并不存在泄露
ruleset=🐟 漏网之鱼,[]FINAL
;设置规则标志位结束

